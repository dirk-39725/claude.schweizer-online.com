<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Löwe in der Savanne – Jagd bei Sonnenuntergang</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: linear-gradient(180deg,
      #1a0f2e 0%,
      #4a1942 12%,
      #8b2e3f 25%,
      #c94b2d 40%,
      #e8762e 52%,
      #f4a637 62%,
      #f7c873 70%,
      #d97b3e 78%,
      #8b4a2e 90%,
      #3d2417 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .scene {
    position: relative;
    width: 100%;
    max-width: 1100px;
    height: 620px;
    margin: 30px auto;
  }

  /* Sonne */
  .sun {
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #fff6d0 0%, #ffdd8a 30%, #f7a13c 60%, #e8762e 100%);
    box-shadow: 0 0 90px 40px rgba(255, 180, 90, 0.55),
                0 0 200px 100px rgba(255, 140, 60, 0.25);
    z-index: 1;
  }

  /* Wolkenbänder */
  .cloud-band {
    position: absolute;
    width: 100%;
    height: 22px;
    left: 0;
    border-radius: 50%;
    filter: blur(6px);
    opacity: 0.5;
    z-index: 2;
  }
  .cloud1 { top: 28%; background: #ffb347; transform: scaleX(1.3); }
  .cloud2 { top: 33%; background: #ff8c42; transform: scaleX(1.1); opacity: 0.4; }
  .cloud3 { top: 46%; background: #7a3b2e; transform: scaleX(1.4); opacity: 0.35; }

  /* Gras / Savanne Silhouette */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 42%;
    background: linear-gradient(180deg, rgba(40,20,15,0.0) 0%, #2a150f 60%, #180a06 100%);
    z-index: 3;
  }

  .grass {
    position: absolute;
    bottom: 0;
    width: 3px;
    background: #1c0f08;
    border-radius: 2px 2px 0 0;
    z-index: 4;
    transform-origin: bottom center;
  }

  /* Akazienbaum */
  .tree {
    position: absolute;
    bottom: 20%;
    left: 12%;
    width: 6px;
    height: 90px;
    background: #150a05;
    z-index: 3;
  }
  .tree::before {
    content: "";
    position: absolute;
    top: -18px;
    left: -55px;
    width: 130px;
    height: 22px;
    background: #150a05;
    border-radius: 50%;
  }
  .tree::after {
    content: "";
    position: absolute;
    top: -35px;
    left: -20px;
    width: 5px;
    height: 40px;
    background: #150a05;
    transform: rotate(-25deg);
  }

  .tree2 {
    left: auto;
    right: 8%;
    bottom: 22%;
    height: 65px;
  }
  .tree2::before { width: 90px; left: -40px; top: -14px; }

  /* Löwe Silhouette – in Sprung-/Jagdhaltung */
  .lion {
    position: absolute;
    bottom: 21%;
    left: 46%;
    width: 240px;
    height: 130px;
    z-index: 5;
  }

  .lion-body {
    position: absolute;
    bottom: 25px;
    left: 40px;
    width: 130px;
    height: 55px;
    background: #0d0603;
    border-radius: 50% 60% 40% 50% / 60% 60% 40% 40%;
    transform: rotate(-6deg);
  }

  .lion-mane {
    position: absolute;
    bottom: 45px;
    left: 145px;
    width: 55px;
    height: 55px;
    background: #0d0603;
    border-radius: 50%;
  }

  .lion-head {
    position: absolute;
    bottom: 55px;
    left: 175px;
    width: 42px;
    height: 34px;
    background: #0d0603;
    border-radius: 40% 50% 50% 45%;
    transform: rotate(8deg);
  }

  .lion-head::before {
    content: "";
    position: absolute;
    bottom: -4px;
    right: -14px;
    width: 20px;
    height: 12px;
    background: #0d0603;
    border-radius: 40% 60% 60% 40%;
  }

  .lion-leg {
    position: absolute;
    width: 10px;
    height: 55px;
    background: #0d0603;
    border-radius: 4px;
  }
  .leg1 { bottom: 0; left: 55px; transform: rotate(15deg); height: 45px; }
  .leg2 { bottom: 0; left: 80px; transform: rotate(-10deg); height: 60px; }
  .leg3 { bottom: 0; left: 130px; transform: rotate(20deg) skewX(10deg); height: 50px; }
  .leg4 { bottom: 0; left: 155px; transform: rotate(-15deg); height: 65px; }

  .lion-tail {
    position: absolute;
    bottom: 55px;
    left: 20px;
    width: 55px;
    height: 8px;
    background: #0d0603;
    border-radius: 10px;
    transform: rotate(25deg);
  }
  .lion-tail::after {
    content: "";
    position: absolute;
    right: -8px;
    top: -6px;
    width: 16px;
    height: 16px;
    background: #0d0603;
    border-radius: 50%;
  }

  /* Vögel */
  .bird {
    position: absolute;
    width: 18px;
    height: 8px;
    z-index: 2;
  }
  .bird::before, .bird::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 2px;
    background: #3a1f14;
    top: 0;
  }
  .bird::before { left: 0; transform: rotate(25deg); border-radius: 4px 0 0 0; }
  .bird::after { right: 0; transform: rotate(-25deg); border-radius: 0 4px 0 0; }
  .b1 { top: 20%; left: 20%; }
  .b2 { top: 24%; left: 25%; transform: scale(0.8); }
  .b3 { top: 18%; left: 30%; transform: scale(0.6); }
  .b4 { top: 22%; left: 78%; }

  .caption {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    color: #fff3e0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }

  .caption h1 {
    font-size: 2.1rem;
    letter-spacing: 1px;
    font-weight: normal;
    margin-bottom: 8px;
  }

  .caption p {
    font-size: 1rem;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.5;
    color: #ffe4c4;
    font-style: italic;
  }

  .vignette {
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 180px 60px rgba(20, 5, 0, 0.55);
    z-index: 20;
    pointer-events: none;
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 1140px;
    padding: 20px;
    background: #0d0704;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .inner {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="frame">
  <div class="inner">
    <div class="scene">
      <div class="sun"></div>

      <div class="cloud-band cloud1"></div>
      <div class="cloud-band cloud2"></div>
      <div class="cloud-band cloud3"></div>

      <div class="bird b1"></div>
      <div class="bird b2"></div>
      <div class="bird b3"></div>
      <div class="bird b4"></div>

      <div class="tree"></div>
      <div class="tree tree2"></div>

      <div class="lion">
        <div class="lion-tail"></div>
        <div class="lion-leg leg1"></div>
        <div class="lion-leg leg2"></div>
        <div class="lion-leg leg3"></div>
        <div class="lion-leg leg4"></div>
        <div class="lion-body"></div>
        <div class="lion-mane"></div>
        <div class="lion-head"></div>
      </div>

      <div class="ground"></div>

      <div class="caption">
        <h1>Der Jäger im Abendlicht</h1>
        <p>Lautlos gleitet die Silhouette des Löwen durch das hohe Gras der Savanne,
        während die Sonne den Horizont in Gold und Purpur taucht –
        ein Moment reiner, ungezähmter Wildnis.</p>
      </div>
    </div>
  </div>
  <div class="vignette"></div>
</div>

</body>
</html>
