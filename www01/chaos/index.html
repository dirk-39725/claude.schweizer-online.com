<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos im Büro? Putzfrau buchen</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f1ea;
    color: #2b2b2b;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 16px 0 4px;
    color: #33302b;
  }
  p.subtitle {
    margin: 0 0 22px;
    color: #6b665e;
    font-size: 0.98rem;
  }
  .illustration-wrap {
    width: 100%;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    padding: 14px;
  }
  .illustration-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
  }
  .cta {
    display: block;
    margin: 30px auto 10px;
    background: #d9542c;
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 17px 24px;
    border-radius: 14px;
    box-shadow: 0 6px 16px rgba(217,84,44,0.35);
    max-width: 340px;
    transition: transform 0.1s ease;
  }
  .cta:active {
    transform: translateY(2px);
  }
  .footnote {
    margin-top: 16px;
    font-size: 0.82rem;
    color: #9a958a;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Chaos im Büro?</h1>
    <p class="subtitle">Wir bringen wieder Ordnung rein.</p>

    <div class="illustration-wrap">
      <svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration eines chaotischen Büros mit umgeworfenem Papierstapel, verschüttetem Kaffee, schiefem Monitor und Kabelsalat">
        <rect x="0" y="0" width="400" height="280" fill="#fbf8f2"/>

        <!-- Schreibtisch -->
        <rect x="20" y="196" width="360" height="16" fill="#a9754f"/>
        <rect x="34" y="212" width="14" height="56" fill="#8a5d3b"/>
        <rect x="352" y="212" width="14" height="56" fill="#8a5d3b"/>

        <!-- Kabelsalat unter dem Tisch -->
        <path d="M120 214 C 140 245, 165 200, 190 240 S 230 205, 260 238 S 300 210, 330 236" stroke="#8a5d3b" stroke-width="3" fill="none" opacity="0.7"/>

        <!-- schiefer Monitor -->
        <g transform="rotate(-6 130 150)">
          <rect x="76" y="110" width="112" height="76" rx="4" fill="#3d3d3d"/>
          <rect x="84" y="118" width="96" height="56" fill="#7fb3d5"/>
          <rect x="122" y="186" width="20" height="12" fill="#3d3d3d"/>
          <rect x="108" y="198" width="48" height="7" fill="#2b2b2b"/>
        </g>
        <!-- Tastatur schief -->
        <rect x="70" y="205" width="90" height="8" rx="2" fill="#cfcac0" transform="rotate(4 115 209)"/>

        <!-- Verstreute Papiere -->
        <g>
          <rect x="215" y="150" width="40" height="28" fill="#ffffff" stroke="#d8d0c4" transform="rotate(14 235 164)"/>
          <rect x="240" y="168" width="40" height="28" fill="#ffffff" stroke="#d8d0c4" transform="rotate(-16 260 182)"/>
          <rect x="185" y="172" width="40" height="28" fill="#ffffff" stroke="#d8d0c4" transform="rotate(-9 205 186)"/>
          <line x1="222" y1="158" x2="246" y2="158" stroke="#c9c0b2" stroke-width="2"/>
          <line x1="222" y1="166" x2="246" y2="166" stroke="#c9c0b2" stroke-width="2"/>
        </g>

        <!-- Umgekippter Kaffeebecher mit Fleck -->
        <ellipse cx="300" cy="200" rx="28" ry="9" fill="#caa06a" opacity="0.55"/>
        <rect x="284" y="182" width="34" height="16" rx="3" fill="#ffffff" stroke="#c9c0b2" transform="rotate(70 301 190)"/>
        <rect x="284" y="182" width="34" height="4" rx="2" fill="#6b4a30" transform="rotate(70 301 190)"/>

        <!-- Ordner, schief gestapelt -->
        <g transform="translate(300,130) rotate(-9)">
          <rect x="0" y="0" width="52" height="14" fill="#d9542c"/>
          <rect x="5" y="-14" width="44" height="14" fill="#3a7ca5"/>
          <rect x="10" y="-27" width="35" height="14" fill="#e8c547"/>
        </g>

        <!-- Wackelige Lampe -->
        <g transform="rotate(13 55 95)">
          <line x1="55" y1="196" x2="55" y2="112" stroke="#5a5a5a" stroke-width="4"/>
          <ellipse cx="55" cy="102" rx="27" ry="15" fill="#f4d35e"/>
        </g>

        <!-- Papierkorb umgekippt mit Papierbällen -->
        <g transform="translate(345,195) rotate(60)">
          <path d="M0 0 L28 0 L24 30 L4 30 Z" fill="#b9b3a6"/>
        </g>
        <circle cx="360" cy="222" r="6" fill="#ffffff" stroke="#d8d0c4"/>
        <circle cx="372" cy="230" r="5" fill="#ffffff" stroke="#d8d0c4"/>
      </svg>
    </div>

    <a class="cta" href="http://www.putzfrau.ch" target="_blank" rel="noopener">Putzfrau buchen</a>

    <p class="footnote">Schnell, zuverlässig, unkompliziert.</p>
  </div>
</body>
</html>
